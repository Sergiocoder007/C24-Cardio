name: Android debug APK

# Builds a debug APK in the cloud. Runs on pushes to orange-rebuild only
# (never main) and can be started by hand from the Actions tab.
on:
  push:
    branches: [orange-rebuild]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed only to create/update the private draft release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        # package-lock.json predates the Capacitor dependencies, so resolve
        # with npm install; the resolved lock file is uploaded below.
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production web build
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Icons and splash screens
        run: |
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#050505' --iconBackgroundColorDark '#050505' \
            --splashBackgroundColor '#050505' --splashBackgroundColorDark '#050505'

      - name: Version
        run: |
          VERSION_NAME=$(node -p 'require("./package.json").version')
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          NAME="c24-cardio-debug-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          ls -la "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: c24-cardio-debug-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Upload resolved lock file
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 14

      - name: Private draft release with the APK
        # Draft releases are visible only to people with write access to the
        # repo. Older debug drafts are replaced so only the latest remains.
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: C24 Cardio debug build (orange-rebuild)
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .name == \"${TITLE}\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"; done
          gh release create "android-debug-${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.name }}" \
            --draft --target "${GITHUB_SHA}" --title "${TITLE}" \
            --notes "Debug build from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}). Not for the Play Store: debug-signed, for testing on your own phone."
