name: Android debug APK

# Builds a debug APK in the cloud. Runs on pushes to orange-rebuild only
# (never main) and can be started by hand from the Actions tab.
on:
  push:
    branches: [orange-rebuild]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed only to create/update the private draft release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        # GitHub's Ubuntu runners ship the Android SDK with licenses accepted.
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          "$SDKM" --list_installed | grep -E "platforms;android-36|build-tools;36" || true

      - name: Install packages
        # package-lock.json predates the Capacitor dependencies, so resolve
        # with npm install; the resolved lock file is uploaded below.
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production web build
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Icons and splash screens
        run: |
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#050505' --iconBackgroundColorDark '#050505' \
            --splashBackgroundColor '#050505' --splashBackgroundColorDark '#050505'

      - name: Version
        run: |
          VERSION_NAME=$(node -p 'require("./package.json").version')
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle

      - name: Sync web build into Android
        run: npx cap sync android

      # Reuse one debug signing key across builds so each new APK installs as an
      # update (keeping workout history). The key lives only in the Actions
      # cache, never in the repo. It is a throwaway debug key, not a release key.
      # Note: GitHub drops caches unused for 7 days; after that a new key is made
      # and the phone needs one uninstall.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: c24-debug-keystore-v1

      - name: Create debug signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "No cached debug key; creating a new one"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -i "SHA-256"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Signing certificate of the APK
        run: |
          APKSIGNER=$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Native timer unit tests
        working-directory: android
        run: ./gradlew :c24-workout-timer:testDebugUnitTest --no-daemon

      - name: Check background-timer manifest entries
        run: |
          AAPT2=$(ls -d "${ANDROID_HOME}"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml android/app/build/outputs/apk/debug/app-debug.apk > manifest.txt
          for needle in WorkoutTimerService FOREGROUND_SERVICE_MEDIA_PLAYBACK POST_NOTIFICATIONS WAKE_LOCK 'foregroundServiceType'; do
            grep -q "$needle" manifest.txt || { echo "missing in manifest: $needle"; exit 1; }
          done
          grep -E "uses-permission|service|foregroundServiceType|targetSdkVersion|minSdkVersion" -A1 manifest.txt | grep -E 'name=|Type|Sdk' | head -40

      - name: Name the APK
        id: apk
        run: |
          NAME="c24-cardio-debug-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          ls -la "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: c24-cardio-debug-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Upload resolved lock file
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 14

      - name: Private draft release with the APK
        # Draft releases are visible only to people with write access to the
        # repo. Older debug drafts are replaced so only the latest remains.
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: C24 Cardio debug build (orange-rebuild)
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .name == \"${TITLE}\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"; done
          gh release create "android-debug-${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.name }}" \
            --draft --target "${GITHUB_SHA}" --title "${TITLE}" \
            --notes "Debug build from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}). Not for the Play Store: debug-signed, for testing on your own phone."
