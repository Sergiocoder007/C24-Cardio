name: Android release bundle (Play Store)

# Builds the signed .aab to upload to Google Play. Started by hand only
# (Actions › Android release bundle › Run workflow). The upload key comes from
# repository secrets and is never stored in the repo:
#   C24_UPLOAD_KEYSTORE_BASE64, C24_UPLOAD_KEYSTORE_PASSWORD,
#   C24_UPLOAD_KEY_ALIAS, C24_UPLOAD_KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: write # private draft release with the .aab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        # GitHub's Ubuntu runners ship the Android SDK with licenses accepted.
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          "$SDKM" --list_installed | grep -E "platforms;android-36|build-tools;36" || true

      - name: Install packages
        # package-lock.json predates the Capacitor dependencies, so resolve
        # with npm install; the resolved lock file is uploaded below.
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production web build
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Challenge links
        run: node scripts/android-deeplinks.mjs

      - name: Icons and splash screens
        run: |
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#050505' --iconBackgroundColorDark '#050505' \
            --splashBackgroundColor '#050505' --splashBackgroundColorDark '#050505'

      - name: Sharp launch screen logo
        run: node scripts/android-splash.mjs

      - name: Version
        run: |
          VERSION_NAME=$(node -p 'require("./package.json").version')
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $((1000 + GITHUB_RUN_NUMBER))/" android/app/build.gradle
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle

      - name: Sync web build into Android
        run: npx cap sync android

      # Reuse one debug signing key across builds so each new APK installs as an
      # update (keeping workout history). The key lives only in the Actions
      # cache, never in the repo. It is a throwaway debug key, not a release key.
      # Note: GitHub drops caches unused for 7 days; after that a new key is made
      # and the phone needs one uninstall.
      - name: Release signing from secrets
        env:
          KEYSTORE_B64: ${{ secrets.C24_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No upload key secrets: building an UNSIGNED bundle to sign on the owner's machine."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  c24upload {
                      storeFile file(System.getenv('C24_KEYSTORE_FILE'))
                      storePassword System.getenv('C24_UPLOAD_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('C24_UPLOAD_KEY_ALIAS')
                      keyPassword System.getenv('C24_UPLOAD_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.c24upload
                  }
              }
          }
          GRADLE

      - name: Build signed release bundle
        working-directory: android
        env:
          C24_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          C24_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.C24_UPLOAD_KEYSTORE_PASSWORD }}
          C24_UPLOAD_KEY_ALIAS: ${{ secrets.C24_UPLOAD_KEY_ALIAS }}
          C24_UPLOAD_KEY_PASSWORD: ${{ secrets.C24_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Check the bundle is signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$RUNNER_TEMP/upload.jks" ] || { echo "unsigned bundle"; exit 0; }
          jarsigner -verify "$AAB" | tail -1
          keytool -printcert -jarfile "$AAB" | grep -E "SHA256|Owner" | head -2
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Name the bundle
        id: aab
        run: |
          SUFFIX=$([ -n "${{ secrets.C24_UPLOAD_KEYSTORE_BASE64 }}" ] && echo "" || echo "-unsigned")
          NAME="c24-cardio-${GITHUB_SHA::7}-build${GITHUB_RUN_NUMBER}${SUFFIX}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$NAME"
          ls -la "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Private draft release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: C24 Cardio Play Store bundle
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .name == \"${TITLE}\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"; done
          gh release create "play-${GITHUB_RUN_NUMBER}" "${{ steps.aab.outputs.name }}" \
            --draft --target "${GITHUB_SHA}" --title "${TITLE}" \
            --notes "Signed with the upload key. Upload this .aab in Play Console."
